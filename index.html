<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Naijs</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.12), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.08), transparent 30%),
        linear-gradient(135deg, #064d32, #087443 45%, #043d28);
    }

    #game {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Decorative background shapes */

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.35;
      animation: float 8s ease-in-out infinite;
    }

    .orb.one {
      width: 220px;
      height: 220px;
      background: #f7c948;
      top: -70px;
      left: -60px;
    }

    .orb.two {
      width: 300px;
      height: 300px;
      background: #20a866;
      bottom: -140px;
      right: -100px;
      animation-delay: -3s;
    }

    .orb.three {
      width: 120px;
      height: 120px;
      background: #f2f2f2;
      top: 25%;
      right: 8%;
      opacity: 0.08;
      animation-delay: -5s;
    }

    .pattern {
      position: absolute;
      inset: 0;
      opacity: 0.06;
      background-image:
        linear-gradient(45deg, white 1px, transparent 1px),
        linear-gradient(-45deg, white 1px, transparent 1px);
      background-size: 45px 45px;
      transform: rotate(8deg) scale(1.3);
    }

    .title-screen {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 720px;
      text-align: center;
      padding: 45px 25px;
    }

    .logo {
      font-size: clamp(52px, 13vw, 96px);
      font-weight: 900;
      letter-spacing: -5px;
      line-height: 0.95;
      text-shadow: 0 8px 30px rgba(0,0,0,0.25);
      margin-bottom: 12px;
    }

    .logo span {
      color: #f7c948;
    }

    .tagline {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 55px;
    }

    .welcome {
      font-size: clamp(25px, 6vw, 38px);
      font-weight: 800;
      margin-bottom: 12px;
    }

    .subtext {
      color: rgba(255,255,255,0.78);
      line-height: 1.6;
      font-size: 16px;
      margin: 0 auto 32px;
      max-width: 430px;
    }

    .play-button {
      border: 0;
      border-radius: 999px;
      padding: 17px 48px;
      background: #f7c948;
      color: #123322;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .play-button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }

    .game-screen {
      display: none;
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 700px;
      background: #f4efe6;
      color: #222;
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0,0,0,0.3);
    }

    .baby {
      font-size: 90px;
      margin: 10px 0;
    }

    .headline {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .description {
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0);
      }

      50% {
        transform: translateY(-25px) translateX(12px);
      }
    }
  </style>
</head>

<body>

  <div id="game">

    <div class="pattern"></div>

    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

    <div class="title-screen" id="titleScreen">

      <div class="logo">
        THE <span>NAIJS</span>
      </div>

      <div class="tagline">
        A Nigerian life. Your choices. Your story.
      </div>

      <div class="welcome" id="welcomeText">
        Welcome to The Naijs
      </div>

      <p class="subtext" id="subText">
        No dull yourself. Your life is about to begin.
      </p>

      <button class="play-button" id="playButton" onclick="startGame()">
        ▶ PLAY
      </button>

    </div>


    <div class="game-screen" id="gameScreen">

      <div class="baby">👶🏾</div>

      <div class="headline">
        YOU NO GET CHOICE
      </div>

      <div class="description">
        Welcome to Nigeria. You have just been born.
        Your family, your state, your circumstances
        and your story are about to be decided.
      </div>

      <button class="play-button" onclick="beginLife()">
        Continue
      </button>

    </div>

  </div>


  <script>

    const hasSavedGame = localStorage.getItem("theNaijsSave");

    if (hasSavedGame) {
      document.getElementById("welcomeText").textContent =
        "Welcome back to The Naijs";

      document.getElementById("subText").textContent =
        "Your story is still waiting for you.";

      document.getElementById("playButton").textContent =
        "▶ CONTINUE";
    }

    function startGame() {
      document.getElementById("titleScreen").style.display = "none";
      document.getElementById("gameScreen").style.display = "block";

      localStorage.setItem("theNaijsSave", "started");
    }

    function beginLife() {
      alert("Birth system coming next.");
    }

  </script>

</body>
</html>
