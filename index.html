<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Naijs</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#061b13;
 color:white;
 overflow:hidden
}

button{font:inherit;cursor:pointer}

#game{
 min-height:100vh;
 position:relative;
 overflow:hidden;
 background:linear-gradient(#73c7e5 0%,#c5edf3 48%,#57945b 48%,#326b38 100%)
}

/* TITLE WORLD */

.sun{
 position:absolute;
 width:90px;height:90px;
 border-radius:50%;
 background:#ffd447;
 top:50px;right:45px;
 box-shadow:0 0 45px #ffd447
}

.cloud{
 position:absolute;
 width:135px;height:35px;
 background:white;
 border-radius:50px;
 opacity:.8;
 animation:cloudMove 28s linear infinite
}

.cloud:before,.cloud:after{
 content:"";
 position:absolute;
 background:white;
 border-radius:50%
}

.cloud:before{width:55px;height:55px;left:20px;top:-25px}
.cloud:after{width:70px;height:70px;right:15px;top:-35px}

.cloud.one{top:90px;left:-160px}
.cloud.two{top:170px;left:-300px;animation-delay:10s}

@keyframes cloudMove{
 from{transform:translateX(0)}
 to{transform:translateX(120vw)}
}

.city{
 position:absolute;
 bottom:31%;
 left:0;right:0;
 height:150px;
 display:flex;
 align-items:flex-end;
 gap:8px;
 padding:0 20px
}

.building{
 width:70px;
 height:110px;
 background:#747f7b
}

.building:nth-child(2){height:145px}
.building:nth-child(3){height:95px}
.building:nth-child(4){height:125px}
.building:nth-child(5){height:80px}

.windows{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 padding:12px
}

.windows span{
 height:13px;
 background:#f5d65d
}

.ground{
 position:absolute;
 bottom:0;
 width:100%;
 height:31%;
 background:#326b38
}

.road{
 position:absolute;
 bottom:0;
 width:100%;
 height:105px;
 background:#303332
}

.road:after{
 content:"";
 position:absolute;
 top:48px;left:0;right:0;
 height:7px;
 background:repeating-linear-gradient(
  90deg,#f3df72 0 55px,transparent 55px 105px
 )
}

.bus{
 position:absolute;
 bottom:45px;
 left:-180px;
 width:150px;height:65px;
 background:#e5b91e;
 border-radius:12px 18px 5px 5px;
 animation:busMove 13s linear infinite
}

.bus:before{
 content:"";
 position:absolute;
 width:95px;height:25px;
 background:#243b36;
 top:10px;left:12px;
 border-radius:4px
}

@keyframes busMove{
 from{left:-180px}
 to{left:110%}
}

/* TITLE CARD */

.card{
 position:relative;
 z-index:10;
 width:min(92%,600px);
 margin:auto;
 top:50vh;
 transform:translateY(-50%);
 padding:35px 28px;
 border-radius:24px;
 background:rgba(3,35,23,.92);
 text-align:center;
 box-shadow:0 20px 60px rgba(0,0,0,.35)
}

.logo{
 font-size:clamp(48px,12vw,82px);
 font-weight:1000;
 letter-spacing:-4px
}

.logo span{color:#ffd42f}

.tagline{
 color:#d8e7df;
 font-size:15px
}

.card h2{margin-top:30px}

.card p{
 color:#d6ded9;
 line-height:1.5
}

.main-btn{
 margin-top:20px;
 border:0;
 border-radius:14px;
 padding:15px 35px;
 background:#ffd42f;
 color:#173522;
 font-weight:900;
 font-size:17px
}

/* BIRTH SCENE */

.birth-screen{
 display:none;
 position:relative;
 z-index:30;
 min-height:100vh;
 background:#071b14
}

.delivery-room{
 min-height:100vh;
 position:relative;
 overflow:hidden;
 background:linear-gradient(#d8e7e3,#9fb8b1)
}

.hospital-sign{
 position:absolute;
 top:25px;
 left:50%;
 transform:translateX(-50%);
 background:white;
 color:#174b38;
 padding:12px 22px;
 border-radius:8px;
 font-weight:bold;
 z-index:5
}

/* WINDOW */

.room-window{
 position:absolute;
 top:0;
 left:0;
 width:32%;
 height:35%;
 background:#83cde0;
 border-right:8px solid white;
 border-bottom:8px solid white
}

.window-sun{
 position:absolute;
 width:55px;height:55px;
 border-radius:50%;
 background:#ffd447;
 top:35px;right:25px
}

/* BED */

.delivery-bed{
 position:absolute;
 width:310px;
 height:145px;
 background:white;
 border-radius:18px;
 left:50%;
 top:52%;
 transform:translate(-50%,-50%);
 box-shadow:0 18px 40px rgba(0,0,0,.2)
}

.mother{
 position:absolute;
 left:60px;
 top:-75px;
 font-size:90px;
 animation:mumMove 1.8s ease-in-out infinite
}

@keyframes mumMove{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-5px)}
}

/* PEOPLE */

.person{
 position:absolute;
 display:flex;
 flex-direction:column;
 align-items:center;
 font-size:65px;
 z-index:4;
 animation:personMove 2s ease-in-out infinite alternate
}

.person span{
 background:rgba(0,0,0,.7);
 padding:4px 8px;
 border-radius:7px;
 font-size:11px;
 color:white
}

.person.nurse{
 left:10%;
 top:43%
}

.person.doctor{
 right:10%;
 top:39%;
 animation-delay:.5s
}

.person.family{
 left:43%;
 bottom:9%;
 animation-delay:1s
}

@keyframes personMove{
 from{transform:translateY(0)}
 to{transform:translateY(-8px)}
}

/* DELIVERY */

.delivery-text{
 position:absolute;
 bottom:22%;
 left:50%;
 transform:translateX(-50%);
 color:#173c2d;
 font-weight:bold;
 font-size:18px;
 white-space:nowrap;
 animation:pulse 1.2s infinite
}

@keyframes pulse{
 50%{opacity:.45}
}

/* BABY ARRIVAL */

.baby-scene{
 position:absolute;
 inset:0;
 z-index:20;
 background:rgba(4,30,21,.82);
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 opacity:0;
 pointer-events:none;
 transform:scale(.85);
 transition:1.2s
}

.baby-scene.show{
 opacity:1;
 transform:scale(1)
}

.baby{
 font-size:105px;
 animation:babyBounce .8s ease-in-out infinite alternate
}

@keyframes babyBounce{
 from{transform:translateY(4px)}
 to{transform:translateY(-10px)}
}

.baby-scene h1{
 color:#ffd42f;
 font-size:clamp(40px,10vw,75px);
 margin:10px;
 text-align:center
}

.baby-scene p{
 font-size:17px;
 text-align:center
}

/* BIRTH RESULT */

.birth-result{
 display:none;
 min-height:100vh;
 overflow:auto;
 padding:35px 18px;
 background:linear-gradient(#073b29,#061e15)
}

.birth-container{
 width:min(100%,720px);
 margin:auto
}

.birth-title{
 text-align:center;
 font-size:clamp(35px,9vw,60px);
 font-weight:1000;
 margin:10px 0
}

.birth-subtitle{
 text-align:center;
 color:#b9d1c6;
 margin-bottom:
