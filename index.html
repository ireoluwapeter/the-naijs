<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Naijs</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    #game {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .title-screen {
      width: 100%;
      max-width: 700px;
      text-align: center;
      padding: 40px 24px;
    }

    .logo {
      font-size: clamp(48px, 12vw, 88px);
      font-weight: 900;
      letter-spacing: -4px;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 48px;
    }

    .welcome {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtext {
      color: #aaa;
      line-height: 1.6;
      margin: 0 auto 30px;
      max-width: 430px;
    }

    .play-button {
      border: none;
      border-radius: 14px;
      padding: 16px 50px;
      background: white;
      color: #111;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .play-button:hover {
      transform: translateY(-2px);
    }

    .game-screen {
      display: none;
      width: 100%;
      max-width: 700px;
      background: #f4efe6;
      color: #222;
      border-radius: 24px;
      padding: 30px;
      text-align: center;
    }

    .baby {
      font-size: 90px;
      margin: 15px 0;
    }

    .headline {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .description {
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }
  </style>
</head>

<body>

  <div id="game">

    <div class="title-screen" id="titleScreen">

      <div class="logo">THE NAIJS</div>

      <div class="tagline">
        A Nigerian life. Your choices. Your story.
      </div>

      <div class="welcome" id="welcomeText">
        Welcome to The Naijs
      </div>

      <p class="subtext" id="subText">
        No dull yourself. Your life is about to begin.
      </p>

      <button class="play-button" id="playButton" onclick="startGame()">
        ▶ PLAY
      </button>

    </div>


    <div class="game-screen" id="gameScreen">

      <div class="baby">👶🏾</div>

      <div class="headline">
        YOU NO GET CHOICE
      </div>

      <div class="description">
        Welcome to Nigeria. You have just been born.
        Your family, your state, your circumstances
        and your story are about to be decided.
      </div>

      <button class="play-button" onclick="beginLife()">
        Continue
      </button>

    </div>

  </div>


  <script>

    const hasSavedGame = localStorage.getItem("theNaijsSave");

    if (hasSavedGame) {
      document.getElementById("welcomeText").textContent =
        "Welcome back to The Naijs";

      document.getElementById("subText").textContent =
        "Your story is still waiting for you.";

      document.getElementById("playButton").textContent =
        "▶ CONTINUE";
    }


    function startGame() {

      document.getElementById("titleScreen").style.display = "none";
      document.getElementById("gameScreen").style.display = "block";

      localStorage.setItem("theNaijsSave", "started");

    }


    function beginLife() {

      alert("Birth system coming next.");

    }

  </script>

</body>
</html>
